name: Cek data

on:
  pull_request:
    paths:
      - "data/**"
      - "assets/img/**"
      - "tools/cek-data.py"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/img/**"
      - "tools/cek-data.py"
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Periksa konsistensi berkas data
        run: python tools/cek-data.py
